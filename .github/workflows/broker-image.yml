name: Publish broker image

on:
  push:
    tags:
      - 'broker-v*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @jovita-ai/provider-catalog
      - run: npm run build -w @jovita-ai/broker
      - run: npm test -w @jovita-ai/broker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/broker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/venbrinodevelopers/jovita-broker:${{ github.ref_name }}
            ghcr.io/venbrinodevelopers/jovita-broker:sha-${{ github.sha }}
