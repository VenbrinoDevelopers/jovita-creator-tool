name: Publish npm packages

on:
  push:
    tags:
      - 'npm-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'Release tags must point to a commit on main.' >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#npm-v}"
          actual="$(node -p "require('./packages/cli/package.json').version")"
          test "$version" = "$actual" || {
            echo "Tag version $version does not match @jovita-ai/cli@$actual" >&2
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
      - run: npm ci
      - run: npm run build
      - name: Verify executable CLI entry
        run: |
          node -e "const fs = require('node:fs'); const path = 'packages/cli/dist/index.js'; if (!(fs.statSync(path).mode & 0o111)) throw new Error(path + ' must be executable')"
          test "$(node packages/cli/dist/index.js --version)" = "$(node -p "require('./packages/cli/package.json').version")"
      - run: npm run typecheck
      - run: npm test
      - name: Publish runtime, SDK, then CLI
        shell: bash
        run: |
          set -euo pipefail
          for package in runtime sdk cli; do
            name="$(node -p "require('./packages/$package/package.json').name")"
            version="$(node -p "require('./packages/$package/package.json').version")"
            if npm view "$name@$version" version --registry=https://registry.npmjs.org/ > /tmp/npm-version.out 2> /tmp/npm-version.err; then
              echo "$name@$version is already published; skipping."
            elif grep -q 'E404' /tmp/npm-version.err; then
              echo "Publishing $name@$version"
              npm publish "./packages/$package" --access public --registry=https://registry.npmjs.org/
            else
              cat /tmp/npm-version.err >&2
              exit 1
            fi
            visible=false
            for attempt in $(seq 1 60); do
              if npm view "$name@$version" version --prefer-online --registry=https://registry.npmjs.org/ > /dev/null 2>&1; then
                visible=true
                break
              fi
              sleep 10
            done
            test "$visible" = true || {
              echo "$name@$version was accepted but did not become visible on npm within 10 minutes." >&2
              exit 1
            }
          done
